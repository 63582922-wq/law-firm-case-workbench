[project]
name = "law-firm-case-workbench-api"
version = "0.1.0"
description = "Synthetic Alpha API boundary for the law-firm case workbench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.7,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["case_api*", "case_kernel*"]
