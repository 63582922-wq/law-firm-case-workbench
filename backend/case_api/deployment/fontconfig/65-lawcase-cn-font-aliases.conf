<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Server-side Office rendering cannot redistribute the proprietary Chinese
  fonts commonly named by domestic Word templates.  These aliases are an
  explicit, deterministic substitution contract: they map those family names
  to the Debian fonts-noto-cjk package.  They do not install or claim to be the
  original 方正/中易/微软 font files.
-->
<fontconfig>
  <alias binding="strong">
    <family>方正小标宋简体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>FZXiaoBiaoSong-B05S</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>小标宋</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>宋体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SimSun</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>NSimSun</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>新宋体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>仿宋</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>仿宋_GB2312</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>FangSong</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>楷体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>楷体_GB2312</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>KaiTi</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>思源宋体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Source Han Serif SC</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <!-- Keep the mixed Chinese/Latin metrics deterministic when the OOXML
       declares the conventional Times New Roman Latin family. -->
  <alias binding="strong">
    <family>Times New Roman</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>

  <alias binding="strong">
    <family>黑体</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SimHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>微软雅黑</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Microsoft YaHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>等线</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>DengXian</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>思源黑体</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Source Han Sans SC</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
</fontconfig>
