# Local Unix-socket bootstrap. Only the PostgreSQL process and the bounded
# migration job share this socket; application/runtime services never do.
local   all         postgres                                                     peer
local   all         all                                                          reject

# Refuse every non-TLS TCP connection before evaluating a password.
hostnossl all       all                     0.0.0.0/0                             reject
hostnossl all       all                     ::/0                                  reject

# Lawcase runtime and migration identities. All passwords are SCRAM verifiers.
hostssl lawcase     lawcase_migrator        0.0.0.0/0                             scram-sha-256
hostssl lawcase     lawcase_migrator        ::/0                                  scram-sha-256
hostssl lawcase     lawcase_web_application 0.0.0.0/0                             scram-sha-256
hostssl lawcase     lawcase_web_application ::/0                                  scram-sha-256
hostssl lawcase     lawcase_identity_directory 0.0.0.0/0                          scram-sha-256
hostssl lawcase     lawcase_identity_directory ::/0                               scram-sha-256
hostssl lawcase     lawcase_web_session_gateway 0.0.0.0/0                         scram-sha-256
hostssl lawcase     lawcase_web_session_gateway ::/0                              scram-sha-256
hostssl lawcase     lawcase_agent_worker    0.0.0.0/0                             scram-sha-256
hostssl lawcase     lawcase_agent_worker    ::/0                                  scram-sha-256
hostssl lawcase     lawcase_agent_verifier  0.0.0.0/0                             scram-sha-256
hostssl lawcase     lawcase_agent_verifier  ::/0                                  scram-sha-256

# Keycloak owns only its own database. It is intentionally absent from every
# Lawcase rule and the Lawcase roles are absent from this database rule.
hostssl keycloak    keycloak                0.0.0.0/0                             scram-sha-256
hostssl keycloak    keycloak                ::/0                                  scram-sha-256

# No implicit fallback for a new role or database.
hostssl all         all                     0.0.0.0/0                             reject
hostssl all         all                     ::/0                                  reject
