# Isolated local managed-test daemon.  It has no network interface; clients
# receive only the Unix socket shared with the Web API and the acceptance probe.
Foreground yes
LogTime yes
LogClean no
ExtendedDetectionInfo yes
DatabaseDirectory /var/lib/clamav
LocalSocket /run/lawcase-clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
PidFile /run/lawcase-clamav/clamd.pid
TemporaryDirectory /tmp
User clamav
ReadTimeout 120
CommandReadTimeout 30
SendBufTimeout 200
MaxThreads 2
MaxQueue 8
MaxConnectionQueueLength 8
MaxFileSize 256M
MaxScanSize 512M
StreamMaxLength 256M
AlertExceedsMax yes
ConcurrentDatabaseReload no
ExitOnOOM yes
