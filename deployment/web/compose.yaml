name: lawcase-workbench-web

# The default is deliberately setup-gated. Once the production Web settings
# are supplied, the same API service exposes the real browser workbench.
services:
  gateway:
    image: ${LAWCASE_CADDY_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      LAWCASE_PUBLIC_HOST: ${LAWCASE_PUBLIC_HOST:?set LAWCASE_PUBLIC_HOST in .env}
    ports:
      - "${LAWCASE_BIND_ADDRESS:-127.0.0.1}:${LAWCASE_HTTP_PORT:-8080}:80"
      - "${LAWCASE_BIND_ADDRESS:-127.0.0.1}:${LAWCASE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  frontend:
    build:
      context: ../../web
      dockerfile: ../deployment/web/frontend.Dockerfile
      additional_contexts:
        knowledge: ../../knowledge
      args:
        NODE_IMAGE: ${LAWCASE_NODE_IMAGE:-node:22.23.1-bookworm-slim}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: deployment/web/api.Dockerfile
      args:
        PYTHON_IMAGE: ${LAWCASE_PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
        INSTALL_DOCUMENT_RENDERER_TOOLS: "false"
    restart: unless-stopped
    environment:
      LAWCASE_WEB_RUNTIME_MODE: ${LAWCASE_WEB_RUNTIME_MODE:-SETUP_GATED}
      LAWCASE_WEB_DEPLOYMENT_TOPOLOGY: ${LAWCASE_WEB_DEPLOYMENT_TOPOLOGY:-}
      LAWCASE_WEB_OIDC_STATE_STORE: ${LAWCASE_WEB_OIDC_STATE_STORE:-}
      LAWCASE_WEB_PUBLIC_ORIGIN: ${LAWCASE_WEB_PUBLIC_ORIGIN:-}
      LAWCASE_WEB_OIDC_ISSUER: ${LAWCASE_WEB_OIDC_ISSUER:-}
      LAWCASE_WEB_OIDC_AUTHORIZATION_ENDPOINT: ${LAWCASE_WEB_OIDC_AUTHORIZATION_ENDPOINT:-}
      LAWCASE_WEB_OIDC_TOKEN_ENDPOINT: ${LAWCASE_WEB_OIDC_TOKEN_ENDPOINT:-}
      LAWCASE_WEB_OIDC_JWKS_URL: ${LAWCASE_WEB_OIDC_JWKS_URL:-}
      LAWCASE_WEB_OIDC_CLIENT_ID: ${LAWCASE_WEB_OIDC_CLIENT_ID:-}
      LAWCASE_WEB_OIDC_CLIENT_SECRET: ${LAWCASE_WEB_OIDC_CLIENT_SECRET:-}
      LAWCASE_WEB_OIDC_AUDIENCE: ${LAWCASE_WEB_OIDC_AUDIENCE:-}
      LAWCASE_WEB_OIDC_SCOPES: ${LAWCASE_WEB_OIDC_SCOPES:-openid,profile}
      LAWCASE_WEB_OIDC_REQUIRED_AMR: ${LAWCASE_WEB_OIDC_REQUIRED_AMR:-mfa}
      LAWCASE_WEB_OIDC_ACCEPTED_ACR: ${LAWCASE_WEB_OIDC_ACCEPTED_ACR:-}
      LAWCASE_WEB_APP_POSTGRES_DSN: ${LAWCASE_WEB_APP_POSTGRES_DSN:-}
      LAWCASE_WEB_APP_DATABASE_ROLE: ${LAWCASE_WEB_APP_DATABASE_ROLE:-}
      LAWCASE_WEB_IDENTITY_DIRECTORY_POSTGRES_DSN: ${LAWCASE_WEB_IDENTITY_DIRECTORY_POSTGRES_DSN:-}
      LAWCASE_WEB_IDENTITY_DIRECTORY_DATABASE_ROLE: ${LAWCASE_WEB_IDENTITY_DIRECTORY_DATABASE_ROLE:-}
      LAWCASE_WEB_SESSION_GATEWAY_POSTGRES_DSN: ${LAWCASE_WEB_SESSION_GATEWAY_POSTGRES_DSN:-}
      LAWCASE_WEB_SESSION_GATEWAY_DATABASE_ROLE: ${LAWCASE_WEB_SESSION_GATEWAY_DATABASE_ROLE:-}
      LAWCASE_WEB_OBJECT_STORE_ENDPOINT: ${LAWCASE_WEB_OBJECT_STORE_ENDPOINT:-}
      LAWCASE_WEB_OBJECT_STORE_REGION: ${LAWCASE_WEB_OBJECT_STORE_REGION:-}
      LAWCASE_WEB_OBJECT_STORE_BUCKET: ${LAWCASE_WEB_OBJECT_STORE_BUCKET:-}
      LAWCASE_WEB_OBJECT_STORE_ACCESS_KEY_ID: ${LAWCASE_WEB_OBJECT_STORE_ACCESS_KEY_ID:-}
      LAWCASE_WEB_OBJECT_STORE_SECRET_ACCESS_KEY: ${LAWCASE_WEB_OBJECT_STORE_SECRET_ACCESS_KEY:-}
      LAWCASE_WEB_OBJECT_STORE_ENCRYPTION: ${LAWCASE_WEB_OBJECT_STORE_ENCRYPTION:-}
      LAWCASE_WEB_OBJECT_STORE_KMS_KEY_ID: ${LAWCASE_WEB_OBJECT_STORE_KMS_KEY_ID:-}
      LAWCASE_WEB_CLAMAV_EXECUTABLE: ${LAWCASE_WEB_CLAMAV_EXECUTABLE:-/usr/bin/clamscan}
      LAWCASE_WEB_CLAMAV_TIMEOUT_SECONDS: ${LAWCASE_WEB_CLAMAV_TIMEOUT_SECONDS:-120}
      LAWCASE_WEB_PDFTOPPM_EXECUTABLE: ${LAWCASE_WEB_PDFTOPPM_EXECUTABLE:-/usr/bin/pdftoppm}
      LAWCASE_WEB_PDFTOPPM_TIMEOUT_SECONDS: ${LAWCASE_WEB_PDFTOPPM_TIMEOUT_SECONDS:-30}
      # Browser-originated review candidates use the same fixed, HMAC-bound
      # internal renderer as the Agent Worker. The API image never runs
      # LibreOffice itself.
      LAWCASE_WEB_DOCUMENT_WORKER_ENABLED: ${LAWCASE_WEB_DOCUMENT_WORKER_ENABLED:-false}
      LAWCASE_WEB_DOCUMENT_RENDERER_ENDPOINT: ${LAWCASE_WEB_DOCUMENT_RENDERER_ENDPOINT:-http://document-renderer:8090}
      LAWCASE_WEB_DOCUMENT_RENDERER_SHARED_SECRET: ${LAWCASE_DOCUMENT_RENDERER_SHARED_SECRET:-}
      LAWCASE_WEB_DOCUMENT_RENDERER_TIMEOUT_SECONDS: ${LAWCASE_WEB_DOCUMENT_RENDERER_TIMEOUT_SECONDS:-180}
      LAWCASE_WEB_UPLOAD_STAGING_ROOT: ${LAWCASE_WEB_UPLOAD_STAGING_ROOT:-/var/lib/lawcase/staging}
      LAWCASE_WEB_WORKER_MATERIALIZATION_ROOT: ${LAWCASE_WEB_WORKER_MATERIALIZATION_ROOT:-/var/lib/lawcase/worker}
      LAWCASE_WEB_SYSTEM_WORKERS_JSON: ${LAWCASE_WEB_SYSTEM_WORKERS_JSON:-}
      LAWCASE_WEB_SYSTEM_VERIFIERS_JSON: ${LAWCASE_WEB_SYSTEM_VERIFIERS_JSON:-}
    expose:
      - "8080"
    networks:
      - edge
      - data
      - document-render
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/lib/lawcase/staging:rw,noexec,nosuid,size=4g
      - /var/lib/lawcase/worker:rw,noexec,nosuid,size=4g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One service instance represents exactly one firm's SYSTEM_WORKER.  It is
  # profile-gated so it starts only with explicit production settings; its
  # entrypoint consumes the durable 0033 inbox independently of the Web API.
  case-agent-worker:
    profiles: ["agent-worker"]
    build:
      context: ../..
      dockerfile: deployment/web/api.Dockerfile
      args:
        PYTHON_IMAGE: ${LAWCASE_PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
        # The provider-egress Worker must not contain LibreOffice.  It calls
        # the separately confined renderer through authenticated bytes only.
        INSTALL_DOCUMENT_RENDERER_TOOLS: "false"
    restart: unless-stopped
    command:
      - python
      - -m
      - case_api.case_agent_worker_deployment
    environment:
      LAWCASE_AGENT_WORKER_RUNTIME_MODE: ${LAWCASE_AGENT_WORKER_RUNTIME_MODE:-}
      LAWCASE_AGENT_WORKER_FIRM_ID: ${LAWCASE_AGENT_WORKER_FIRM_ID:-}
      LAWCASE_AGENT_WORKER_ACTOR_ID: ${LAWCASE_AGENT_WORKER_ACTOR_ID:-}
      LAWCASE_AGENT_WORKER_DATABASE_ROLE: ${LAWCASE_AGENT_WORKER_DATABASE_ROLE:-}
      LAWCASE_AGENT_WORKER_POSTGRES_DSN: ${LAWCASE_AGENT_WORKER_POSTGRES_DSN:-}
      LAWCASE_AGENT_VERIFIER_ACTOR_ID: ${LAWCASE_AGENT_VERIFIER_ACTOR_ID:-}
      LAWCASE_AGENT_VERIFIER_DATABASE_ROLE: ${LAWCASE_AGENT_VERIFIER_DATABASE_ROLE:-}
      LAWCASE_AGENT_VERIFIER_POSTGRES_DSN: ${LAWCASE_AGENT_VERIFIER_POSTGRES_DSN:-}
      LAWCASE_AGENT_WORKER_PRIVATE_ROOT: /var/lib/lawcase/agent-worker
      LAWCASE_AGENT_WORKER_OBJECT_STORE_ENDPOINT: ${LAWCASE_AGENT_WORKER_OBJECT_STORE_ENDPOINT:-}
      LAWCASE_AGENT_WORKER_OBJECT_STORE_REGION: ${LAWCASE_AGENT_WORKER_OBJECT_STORE_REGION:-}
      LAWCASE_AGENT_WORKER_OBJECT_STORE_BUCKET: ${LAWCASE_AGENT_WORKER_OBJECT_STORE_BUCKET:-}
      LAWCASE_AGENT_WORKER_OBJECT_STORE_ACCESS_KEY_ID: ${LAWCASE_AGENT_WORKER_OBJECT_STORE_ACCESS_KEY_ID:-}
      LAWCASE_AGENT_WORKER_OBJECT_STORE_SECRET_ACCESS_KEY: ${LAWCASE_AGENT_WORKER_OBJECT_STORE_SECRET_ACCESS_KEY:-}
      LAWCASE_AGENT_WORKER_OBJECT_STORE_ENCRYPTION: ${LAWCASE_AGENT_WORKER_OBJECT_STORE_ENCRYPTION:-}
      LAWCASE_AGENT_WORKER_OBJECT_STORE_KMS_KEY_ID: ${LAWCASE_AGENT_WORKER_OBJECT_STORE_KMS_KEY_ID:-}
      LAWCASE_AGENT_WORKER_DEEPSEEK_API_KEY: ${LAWCASE_AGENT_WORKER_DEEPSEEK_API_KEY:-}
      LAWCASE_AGENT_WORKER_DEEPSEEK_MODEL: ${LAWCASE_AGENT_WORKER_DEEPSEEK_MODEL:-}
      LAWCASE_AGENT_WORKER_DEEPSEEK_ALLOWED_MODELS: ${LAWCASE_AGENT_WORKER_DEEPSEEK_ALLOWED_MODELS:-}
      LAWCASE_AGENT_WORKER_LEDGER_EXTRACTION_API_KEY: ${LAWCASE_AGENT_WORKER_LEDGER_EXTRACTION_API_KEY:-}
      LAWCASE_AGENT_WORKER_LEDGER_EXTRACTION_MODEL: ${LAWCASE_AGENT_WORKER_LEDGER_EXTRACTION_MODEL:-}
      LAWCASE_AGENT_WORKER_BRAVE_SEARCH_API_KEY: ${LAWCASE_AGENT_WORKER_BRAVE_SEARCH_API_KEY:-}
      LAWCASE_AGENT_WORKER_QWEN_API_KEY: ${LAWCASE_AGENT_WORKER_QWEN_API_KEY:-}
      LAWCASE_AGENT_WORKER_QWEN_WORKSPACE_ID: ${LAWCASE_AGENT_WORKER_QWEN_WORKSPACE_ID:-}
      LAWCASE_AGENT_WORKER_QWEN_PDFTOPPM_EXECUTABLE: ${LAWCASE_AGENT_WORKER_QWEN_PDFTOPPM_EXECUTABLE:-}
      LAWCASE_AGENT_WORKER_LAWYER_ANALYSIS_API_KEY: ${LAWCASE_AGENT_WORKER_LAWYER_ANALYSIS_API_KEY:-}
      LAWCASE_AGENT_WORKER_LAWYER_ANALYSIS_WORKSPACE_ID: ${LAWCASE_AGENT_WORKER_LAWYER_ANALYSIS_WORKSPACE_ID:-}
      LAWCASE_AGENT_WORKER_DOCUMENT_DELIVERY_ENABLED: ${LAWCASE_AGENT_WORKER_DOCUMENT_DELIVERY_ENABLED:-false}
      LAWCASE_AGENT_WORKER_DOCUMENT_SOFFICE_EXECUTABLE: ${LAWCASE_AGENT_WORKER_DOCUMENT_SOFFICE_EXECUTABLE:-}
      LAWCASE_AGENT_WORKER_DOCUMENT_PDFTOPPM_EXECUTABLE: ${LAWCASE_AGENT_WORKER_DOCUMENT_PDFTOPPM_EXECUTABLE:-}
      LAWCASE_AGENT_WORKER_DOCUMENT_RENDERER_ENDPOINT: ${LAWCASE_AGENT_WORKER_DOCUMENT_RENDERER_ENDPOINT:-http://document-renderer:8090}
      LAWCASE_AGENT_WORKER_DOCUMENT_RENDERER_SHARED_SECRET: ${LAWCASE_DOCUMENT_RENDERER_SHARED_SECRET:-}
      LAWCASE_AGENT_WORKER_DOCUMENT_RENDERER_TIMEOUT_SECONDS: ${LAWCASE_AGENT_WORKER_DOCUMENT_RENDERER_TIMEOUT_SECONDS:-180}
    networks:
      - data
      # Dedicated outbound-only bridge: the Worker needs TLS egress for the
      # mandatory planner and any explicitly enabled provider adapter, but it
      # exposes no port on this network. Exact provider hosts remain enforced
      # by each server-owned transport policy.
      - provider-egress
      # Byte-only, HMAC-authenticated Office rendering.  This network has no
      # default route to the public internet.
      - document-render
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/lib/lawcase/agent-worker:rw,noexec,nosuid,size=4g,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Dynamic Word/Excel previews run outside the model-capable Agent Worker.
  # Enable this together with the agent-worker profile only when document
  # delivery is configured.  It has no host port and no provider/data network.
  document-renderer:
    profiles: ["document-delivery"]
    build:
      context: ../..
      dockerfile: deployment/web/api.Dockerfile
      args:
        PYTHON_IMAGE: ${LAWCASE_PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
        INSTALL_DOCUMENT_RENDERER_TOOLS: "true"
    restart: unless-stopped
    command:
      - python
      - -m
      - case_api.isolated_document_renderer_app
    environment:
      LAWCASE_DOCUMENT_RENDERER_SHARED_SECRET: ${LAWCASE_DOCUMENT_RENDERER_SHARED_SECRET:?set a unique base64url renderer secret in .env}
      LAWCASE_DOCUMENT_RENDERER_SOFFICE_EXECUTABLE: /usr/bin/soffice
      LAWCASE_DOCUMENT_RENDERER_PDFTOPPM_EXECUTABLE: /usr/bin/pdftoppm
      LAWCASE_DOCUMENT_RENDERER_WORKER_ROOT: /var/lib/lawcase/document-renderer
      LAWCASE_DOCUMENT_RENDERER_TIMEOUT_SECONDS: ${LAWCASE_DOCUMENT_RENDERER_TIMEOUT_SECONDS:-180}
      LAWCASE_DOCUMENT_RENDERER_MAX_CLOCK_SKEW_SECONDS: ${LAWCASE_DOCUMENT_RENDERER_MAX_CLOCK_SKEW_SECONDS:-60}
      LAWCASE_DOCUMENT_RENDERER_REPLAY_CAPACITY: ${LAWCASE_DOCUMENT_RENDERER_REPLAY_CAPACITY:-20000}
      LAWCASE_DOCUMENT_RENDERER_PORT: "8090"
    networks:
      - document-render
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=0700,uid=10001,gid=10001
      - /var/lib/lawcase/document-renderer:rw,noexec,nosuid,size=2g,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s

  postgres:
    image: ${LAWCASE_POSTGRES_IMAGE:-postgres:16.14-alpine3.24}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LAWCASE_POSTGRES_DB:?set LAWCASE_POSTGRES_DB in .env}
      POSTGRES_USER: ${LAWCASE_POSTGRES_USER:?set LAWCASE_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${LAWCASE_POSTGRES_PASSWORD:?set LAWCASE_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    shm_size: 256mb
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  object-storage:
    image: ${LAWCASE_OBJECT_STORE_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${LAWCASE_OBJECT_ROOT_USER:?set LAWCASE_OBJECT_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${LAWCASE_OBJECT_ROOT_PASSWORD:?set LAWCASE_OBJECT_ROOT_PASSWORD in .env}
    volumes:
      - object_data:/data
    networks:
      - data

  object-storage-bootstrap:
    image: ${LAWCASE_OBJECT_CLIENT_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    depends_on:
      object-storage:
        condition: service_started
    environment:
      LAWCASE_OBJECT_ROOT_USER: ${LAWCASE_OBJECT_ROOT_USER:?set LAWCASE_OBJECT_ROOT_USER in .env}
      LAWCASE_OBJECT_ROOT_PASSWORD: ${LAWCASE_OBJECT_ROOT_PASSWORD:?set LAWCASE_OBJECT_ROOT_PASSWORD in .env}
      LAWCASE_OBJECT_BUCKET: ${LAWCASE_OBJECT_BUCKET:?set LAWCASE_OBJECT_BUCKET in .env}
    networks:
      - data
    entrypoint:
      - /bin/sh
      - -ec
    command: |
      until mc alias set lawcase http://object-storage:9000 "$${LAWCASE_OBJECT_ROOT_USER}" "$${LAWCASE_OBJECT_ROOT_PASSWORD}"; do
        echo "waiting for private object storage"
        sleep 2
      done
      mc mb --ignore-existing "lawcase/$${LAWCASE_OBJECT_BUCKET}"
      mc anonymous set none "lawcase/$${LAWCASE_OBJECT_BUCKET}"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  object_data:

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  provider-egress:
    driver: bridge
  document-render:
    driver: bridge
    internal: true
