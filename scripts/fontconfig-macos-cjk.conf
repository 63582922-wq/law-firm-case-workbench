<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    The bundled headless LibreOffice runtime does not inherit macOS CJK font
    discovery.  Document QA sets FONTCONFIG_FILE to this file so the renderer
    sees the same installed Chinese fonts as desktop Word.  Production Linux
    workers use their pinned Noto CJK packages and do not load this file.
  -->
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
