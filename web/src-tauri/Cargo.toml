[package]
name = "law-case-workbench"
version = "0.1.0"
description = "律所案件 AI 工作台本机桌面壳"
authors = ["Law Case Workbench Team"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "law_case_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
chrono = "=0.4.45"
getrandom = "=0.3.4"
keyring = { version = "=3.6.3", features = ["apple-native"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-shell = "=2.3.5"
uuid = { version = "=1.24.0", features = ["v4"] }
zeroize = "=1.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSSecureTextField", "NSTextField", "NSView"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry", "NSString"] }
