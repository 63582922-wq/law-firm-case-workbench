[package]
name = "law-case-workbench"
version = "0.1.0"
description = "律所案件 AI 工作台本机桌面壳"
authors = ["Law Case Workbench Team"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "law_case_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
uuid = "=1.24.0"
